# Illustrative bus line H1 along King Abdulaziz Road (طريق الملك عبدالعزيز), Hail's north-south spine:
# from Al Khamashiyah in the south-east, past the Sports City, King Khalid and Hail General hospitals,
# the old centre (Barzan) and King Salman Specialist Hospital, to the road towards the University of Hail.
id: bus_line_king_abdulaziz
kind: policy
title: "New bus line H1 on King Abdulaziz Rd, every 10 min, 06:00-23:00, 10 % car shift in the catchment"
daytype: weekday
transforms:
  - type: pt_line
    line_id: H1
    both_directions: true
    headway_s: 600
    hours: ["06:00", "23:00"]
    catchment_m: 500
    shift_share: 0.10
    shift_modes: [car, chauffeured, ridehail]
    stop_duration_s: 20
    stops:   # points on King Abdulaziz Rd read from the Hail v2 network, about 1.3 km apart
      - {name: "Al Khamashiyah (south)", lon: 41.7444, lat: 27.4747}
      - {name: "Al Talal", lon: 41.728, lat: 27.4791}
      - {name: "Sinaiyah An Nahdah", lon: 41.7148, lat: 27.484}
      - {name: "Prince Abdulaziz bin Musa'ed Sports City", lon: 41.7087, lat: 27.49}
      - {name: "Al Matar / Sharaf", lon: 41.7003, lat: 27.4988}
      - {name: "King Khalid Hospital", lon: 41.6984, lat: 27.508}
      - {name: "Barzan / Hail General Hospital", lon: 41.697, lat: 27.515}
      - {name: "Al Olaya / King Faisal Rd", lon: 41.6974, lat: 27.5256}
      - {name: "Al Aziziyah", lon: 41.6953, lat: 27.5353}
      - {name: "As Salam", lon: 41.6986, lat: 27.5458}
      - {name: "Az Zahrah", lon: 41.702, lat: 27.5577}
      - {name: "King Salman Specialist Hospital", lon: 41.7055, lat: 27.5702}
      - {name: "Al Qirawan", lon: 41.7086, lat: 27.5886}
      - {name: "An Nisiyah", lon: 41.7193, lat: 27.6086}
      - {name: "Ar Rawabi", lon: 41.738, lat: 27.6248}
      - {name: "Safanah / Dahiyat Al Malik Fahd", lon: 41.7491, lat: 27.638}
      - {name: "Towards the University of Hail", lon: 41.7611, lat: 27.6633}
    assumption: "A-pol-030: line design is illustrative (no published plan for a King Abdulaziz Rd line found): 17 stops about 1.3 km apart over about 22 km, 10-min headway, 06:00-23:00 both ways; stop names are the nearest district or landmark. A-pol-031: 10 % of car, chauffeured and ride-hail tours whose origin and destination both lie within 500 m of different stops (outbound leg in service hours) switch to the bus. No Hail mode-shift evidence; international new-line studies report 2-15 % shifts in the catchment; range 0.02-0.2. Fixed share, no mode choice model. A-pol-091: buses run at the real headway as unscaled vehicles, so in a capacity-scaled sample each bus loads the road like 1/sample cars (conservative)."
