# Bridge B2 across mid Obhur Creek, 2+2 lanes
# Track J (OBHUR_BRIDGE). Geometry and siting: docs/obhur-bridge.md; sources docs/data-sources-trackJ.md.
# Run: python -m sim.bridge.run obhur_bridge_b2 --daytype weekday   (validate only: --validate)
id: obhur_bridge_b2
kind: policy
title: "Bridge B2 across mid Obhur Creek, 2+2 lanes"
daytype: weekday
transforms:
  - type: network_change
    bridges:
      - id: b2
        name: "Obhur Creek mid-creek bridge (B2)"
        lanes: 2
        speed_kmh: 80
        approach_speed_kmh: 60
        south:
          name: "North Corniche Rd near King Abdulaziz Rd (Obhur Al Janubiyah)"
          abutment: [39.11948, 21.73488]
          connect: [[39.11982, 21.73441]]
        north:
          name: "Prince Abdullah Al-Faisal St, both carriageways (Obhur Ash Shamaliyah)"
          abutment: [39.11470, 21.74157]
          connect: [[39.11184, 21.74551], [39.11197, 21.74546]]
        navigation: "Crosses about 0.9 km of open creek between the marinas: boats pass under it, so it needs a navigable clearance or an opening span (the 2014-15 tender design reportedly had a 200 m main span). Not modelled; flagged."
        source_note: "Follows the published route description (Al-Eqtisad, Sep 2020: from Madinah Rd across King Abdulaziz Rd and the Obhur Corniche, over the creek to Prince Abdullah Al-Faisal Rd) at a mid-creek site; the exact alignment is unpublished and the 2021 SYSTRA study compared five options (A-obh-002, docs/data-sources-trackJ.md)."
    reroute: {window: obhur_creek, desire_crossing: true}
    assumption: "A-obh-003: policy design, not behaviour: one two-way bridge across mid-creek (B2), 2+2 lanes, 80 km/h span and 60 km/h approaches (A-obh-004), built as a primary road (A-obh-012). Approach links run straight from each abutment to the snapped bank junctions. Vehicles whose baseline route uses an edge in the obhur_creek window or whose origin-destination line crosses the creek get a one-shot route on the baseline's congested times (A-obh-005); the matched control re-routes the same vehicles without the bridge (TA-018). No induced demand: trips, times and modes are unchanged (A-obh-006)."
