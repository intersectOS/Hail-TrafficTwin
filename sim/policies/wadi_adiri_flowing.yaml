    assumption: "A-pol-150: a full-day closure of every at-grade crossing (a conservative upper bound: in practice crossings close as the flow arrives and reopen after it passes, and Civil Defence may close more of the approaches). Trips that used a crossing are re-routed on the baseline's congested travel times; trips starting or ending on a closed edge move to the nearest open edge of the same district. Demand is not reduced (no school suspension or remote-work order is assumed; combine with remote_work_30 for that case)."
