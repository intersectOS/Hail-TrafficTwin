# Wadi Al-Adiri (وادي الأديرع) running: every at-grade road crossing of the wadi inside the city
# is closed for the whole day, both directions. Hail city lies on the wadi, which splits it into an
# eastern and a western half (Saudipedia); when it flows, residents of the two banks are cut off.
# Arterials that cross it on bridges (OSM bridge=yes) stay open, so the city's east-west traffic
# concentrates on them. Crossings computed from OpenStreetMap (waterway named Wadi Al-Adiri x roads,
# not bridges, 2026-10-17 extract): 23 crossings, edges within 10 m of each crossing point.
id: wadi_adiri_flowing
kind: policy
title: "Wadi Al-Adiri running: all at-grade crossings closed for the day (bridges open)"
daytype: weekday
transforms:
