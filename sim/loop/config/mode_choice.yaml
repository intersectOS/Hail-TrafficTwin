# Track H: binary car-vs-Loop logit that replaces the exogenous shift share alpha (A-loop-009).
#   uv run python -m sim.loop.evaluate --mode-choice sim/loop/config/mode_choice.yaml --ids C1
#   uv run python -m sim.loop.mode_choice sweep ...      (offline, no SUMO; docs/loop-mode-choice.md)
# Every behavioural number sits in a block with `source:` or `assumption:` and is registered in
# docs/assumptions-trackH.md (A-loop-021..). Citations: docs/data-sources-trackH.md (checked 17 Oct 2026).
kind: loop_mode_choice
label: "synthetic demand, uncalibrated"

# Service case the evaluate CLI applies (tunnel speed + capacity scenario of sim/loop/config/loop.yaml;
# the station wait follows the capacity scenario there: measured 12.5 min, engineering 2 min).
service: measured
services:
  measured: {speed_kmh: 90, capacity: measured}
  vendor: {speed_kmh: 160, capacity: engineering}
  source: "A-loop-021: measured = 90 km/h (A-loop-001 middle), 1,355 pax/h per station pair = 5.3 s headway at 2 pax (A-loop-006), 12.5 min wait (A-loop-010); vendor = 160 km/h ('up to 100 mph'), 1.5 s headway = 4,800 pax/h (A-loop-007), 2 min wait (A-loop-010). The two cases of Track D's time-competitive runs."

# Utility of each alternative per leg: V = beta_ivt x generalised minutes. A tour (every leg on one
# mode, Track D rule) chooses on the sum over its legs. P(Loop) = 1 / (1 + exp(V_car - V_loop)).
coefficients:
  beta_ivt_per_min: -0.025
  vot_sar_h: 40
  wait_mult: 2.0
  walk_mult: 2.0
  asc_loop_min: 10
  fare_sar: 5
  beta_source: "A-loop-022: in-vehicle-time coefficient -0.025 per minute: NCHRP Report 716 (2012) Table 4.8, home-based work, 9 US models -0.019 to -0.044 (FTA asks for evidence outside -0.020 to -0.030); non-work trips are flatter (-0.007 to -0.025, Table 4.11); Riyadh stated-preference car-vs-Metro logit (Youssef et al. 2021, Sustainability 13:337) car -0.022, Metro -0.029. One coefficient for all purposes; swept -0.015 to -0.05."
  vot_assumption: "A-loop-023: value of time SAR 40/h (range 20-80), the repo convention A-pol-042; GASTAT Q2 2025 mean wages are ~SAR 64/h (Saudi) and ~SAR 23/h (expatriate), so 40 suits Saudi drivers and is high for the whole working population (~SAR 32/h weighted); no published Saudi value of time. Converts fares and car costs to minutes."
  ovt_source: "A-loop-024: wait time 2.0 x in-vehicle time (brief range 1.5-2.5; NCHRP 716 Tables 4.9/4.30 mean 2.1; Wardman 2004 1.76; Wardman et al. 2026 TR-A 207:104925 1.72); walk time 2.0 x (same sources 2.2 / 1.68 / 1.67; the 2026 meta-analysis finds no significant hot-climate effect, while the Riyadh survey implies ~6 x, an upper bound from a small sample); swept 1.5-3."
  asc_assumption: "A-loop-025: Loop-specific constant = a 10 min generalised-time penalty per leg (range 0-30) against car: a new, unfamiliar mode in a car-dominant city. NCHRP 716: constants are not transferable; Ben-Akiva & Morikawa 2002: no rail bonus once service is equal; no Gulf or Loop constant found. Judgement."
  fare_assumption: "A-loop-026: Loop fare SAR 5 per leg (sweep 0 / 5 / 10 / 20): of the order of the Riyadh Metro ticket (SAR 4 per 2 h, Argaam Nov 2024) and the Jeddah bus (SAR 3.45, secondary); the LVCC Loop is free, Vegas Loop paid stations charge USD 4.25 one way (~SAR 16; Las Vegas Advisor, Jun 2026)."

car:
  parking_search_min: 3
  cost_sar_per_km: 0.22
  ridehail_base_sar: 6.20
  ridehail_sar_per_km: 1.36
  ridehail_sar_per_min: 0.43
  ridehail_min_sar: 12
  ridehail_pickup_min: 5
  assumption: "A-loop-027: car driver = baseline simulated time (duration + departure delay) + 3 min parking search (range 0-8; Shoup 2006 average 8.1 min in dense centres, 3.1 min Manhattan; Jeddah parking is mostly free and plentiful, no Jeddah study) + fuel SAR 0.22/km (gasoline 91 SAR 2.18/L, Aramco Oct 2026; ~10 km/L assumed). Ride-hail = same in-vehicle time, fare SAR 6.20 + 1.36/km + 0.43/min, minimum SAR 12 (Uber KSA recommended fares, March 2023; may be dated), pickup wait 5 min weighted as wait (range 3-10; no Saudi figure)."

queue:
  iterations: 25
  max_queue_min: 60
  segment_riders_per_vehicle: 0.95
  segment_assumption: "A-loop-030: a tunnel segment direction carries 3600 / headway shuttle movements per hour x 0.95 riders per movement (range 0.85-1.54): Track D's C1 runs measured 0.83-1.03 riders per shuttle movement (1.1-1.3 riders per loaded shuttle with the 3 min dispatch window, plus 0.3 empty repositioning trips per loaded trip); 1.54 = full 2-seat pooling. Station pairs keep their passenger capacity (A-loop-006/007)."
  assumption: "A-loop-028: when a station pair's expected demand D in an hour exceeds its capacity C, riders face a deterministic queue (station pair or tunnel segment, whichever is worse) (uniform arrivals over the hour): mean wait (D - C) / (2 C) h, at most 60 min, weighted as wait; fed back into the choice by the method of successive averages (25 iterations). After the draw, riders above C in their pair-hour or segment-hour (arrival order) do not shift and their whole tour stays by car."

# Offline sensitivity grid (python -m sim.loop.mode_choice sweep); central values above.
sweep:
  vot_sar_h: [20, 40, 80]
  wait_mult: [1.5, 2.0, 2.5]
  asc_loop_min: [0, 10, 20]
  fare_sar: [0, 5, 10, 20]
  candidates: [C1, C2, C4, C6]
  # one coefficient at a time, the others central (includes the logit scale and the walk weight)
  one_at_a_time:
    beta_ivt_per_min: [-0.015, -0.02, -0.025, -0.05]
    vot_sar_h: [20, 40, 80]
    wait_mult: [1.5, 2.0, 2.5]
    walk_mult: [1.5, 2.0, 3.0]
    asc_loop_min: [0, 10, 20, 30]
    fare_sar: [0, 5, 10, 20]
  assumption: "A-loop-029: sensitivity ranges of A-loop-023..026 (brief); candidates = C1 (selected) and the next three in the Track D ranking (C2, C4, C6); full grid over VOT x wait x ASC x fare (108 sets) plus one-at-a-time ranges that also vary beta (-0.015 to -0.05, A-loop-022) and the walk weight (1.5-3, A-loop-024)."
