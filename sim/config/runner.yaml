# Runner configuration (python -m sim.runner). Paths relative to the repo root.
label: "synthetic demand, uncalibrated"

# SUMO options shared by both tiers (behavioural settings are registered under `assumptions:` below).
sumo_common:
  - [--step-length, "1"]
  - [--time-to-teleport, "300"]   # A-sim-002
  - --ignore-route-errors
  - --no-step-log
  - --duration-log.statistics
  - [--verbose, "true"]

tier_A:   # city, mesoscopic
  mode: meso
  options:
    - --mesosim
    - --meso-junction-control
    - [--meso-tls-penalty, "0.5"]   # A-sim-001 (see assumptions below)

tier_B:   # focus window, microscopic
  mode: micro
  options: []

# Micro-only features (sublane, bluelight, lane-level outputs, lane-area detectors) are confined to
# Tier B. Options are matched by prefix; additional-file elements by tag. FCD is also barred from
# Tier A (city-scale FCD does not fit in 18 GB; Tier A streams edge bins instead).
micro_only_options:
  - --lateral-resolution
  - --device.bluelight
  - --full-output
  - --netstate-dump
  - --lanechange.
  - --fcd-output
  - --lanechange-output
  - --queue-output
  - --lanedata-output
micro_only_additional_elements:
  - laneData
  - laneAreaDetector
  - e2Detector

# Smoke runs: random trips only, to exercise the network. Not behavioural demand.
smoke:
  teleport_share_max: 0.005
  edgedata_freq_s: 300
  tier_A:
    net: data/jeddah/jeddah.v2.net.xml   # network v2 (Track F, TF-008); v1: data/jeddah/jeddah.net.xml
    begin: 0
    end: 3600
    random_trips:
      period: 0.2          # one departure every 0.2 s -> 18,000 trips in one hour
      fringe_factor: 5
      min_distance: 500
      vclass: passenger
  tier_B:
    net: data/demo/demo.net.xml
    begin: 0
    end: 3600
    random_trips:
      period: 2.0          # 1,800 trips in one hour on the ~3 km2 demo window
      fringe_factor: 5
      min_distance: 300
      vclass: passenger

# Behavioural settings embedded in the SUMO options above (registered in docs/assumptions.md).
assumptions:
  A-sim-001:
    parameter: meso-tls-penalty
    value: 0.5
    assumption: "Scales the expected signal delay of a red phase on meso edges; SUMO docs suggest 0.5-1. No Jeddah signal timing data. Range 0.3-1.0; revisit in the M2 meso-vs-micro fidelity test."
  A-sim-002:
    parameter: time-to-teleport
    value: 300
    assumption: "Seconds a vehicle may stand still before SUMO teleports it; SUMO default. Governs the teleport acceptance metric (< 0.5 %). Range 120-600."
