# SUMO export of vehicle trips (python -m sim.population.export_trips).
kind: export
label: "synthetic demand, uncalibrated"
# Vehicle types for Tier A demand. Emission classes: HBEFA3 (shipped with SUMO). A-exp-001
vtypes:
  car:      {vClass: passenger, length: 4.6, minGap: 2.5, emissionClass: HBEFA3/PC_G_EU4, color: "0.8,0.8,0.8"}
  ridehail: {vClass: passenger, length: 4.8, minGap: 2.5, emissionClass: HBEFA3/PC_G_EU4, color: "1,0.85,0"}
  bus:      {vClass: bus, length: 12.0, minGap: 3.0, emissionClass: HBEFA3/Bus, color: "0.2,0.4,1"}
  assumption: "Petrol Euro-4 passenger cars as the fleet average (Saudi fleet is overwhelmingly petrol; no Jeddah fleet-age data); city bus class for school/company buses. Lengths: SUMO defaults (car 5 m) adjusted to a mid-size sedan. Range: emission class Euro-3..Euro-6."
