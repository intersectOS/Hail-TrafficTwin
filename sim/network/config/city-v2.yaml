# Tier A city network, profile v2 (Track F, docs/network-v2.md). Default profile of
# `python -m sim.network.build_city`; the M1 settings stay in city.yaml (`--network-profile v1`).
# Paths are relative to the repo root. Written under a new name: data/hail/hail.net.xml (v1)
# is never overwritten.
name: hail
extract:
  url: https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
  # Geofabrik has no Saudi-only extract (checked 2026-10-15); the GCC States file contains Saudi Arabia.
  file: data/osm/hail-clip.osm.pbf
polygon: data/osm/hail.poly
clip_pbf: data/osm/hail.osm.pbf
osm_xml: data/osm/hail.osm.gz
fixes_dir: data/osm/fixes
out_dir: data/hail
net: data/hail/hail.v2.net.xml
# Pre-pass (A-net-301, A-net-302): untagged ways of the major classes get the km-weighted median
# lanes per direction and maxspeed of the TAGGED ways of the same class x oneway, measured on this
# clip (`python -m sim.network.lane_defaults stats`). Tagged ways are unchanged.
lane_defaults:
  stats: sim/network/types/hail-lanes.json
  osm_out: data/osm/hail.v2.osm.gz
type_files:
  - "${SUMO_HOME}/data/typemap/osmNetconvert.typ.xml"
  - sim/network/types/city.typ.xml
assumptions:
  A-net-301:
    parameter: lanes per direction for untagged major OSM ways (class x oneway)
    value: "median of tagged ways on the Hail clip: motorway 2, trunk 3, primary 3, secondary 3, tertiary 4 (oneway); two-way ways keep the SUMO typemap"
    source: "OSM tags on the same clip, sim/network/types/hail-lanes.json; held-out check sim/network/types/hail-lanes-crosscheck.json"
  A-net-303:
    parameter: traffic signals at arterial crossings
    value: "a signal (static program, netconvert defaults) at every at-grade junction where a primary, secondary or trunk road meets another street of tertiary class or above (tls_rule below); signals on one junction cluster are joined"
    assumption: "OpenStreetMap maps only 22 signal nodes in the whole Hail clip, and netconvert's --tls.guess picked 5-way residential clusters instead of the arterials. Hail's King Abdulaziz, King Fahd, King Khalid and King Faisal corridors are signalised in reality, so the rule targets their crossings. Replace with the Municipality's signal inventory and timings when available."
  A-net-302:
    parameter: maxspeed for untagged major OSM ways (class x oneway)
    value: "median of tagged ways on the Hail clip: motorway 120, trunk 100, primary 100, tertiary 80 km/h (the clip includes the intercity highways, so urban limits are probably lower; sweep -20 %)"
    source: "OSM tags on the same clip, sim/network/types/hail-lanes.json"
tls_rule:
  major: [highway.primary, highway.secondary, highway.trunk]
  cross: [highway.tertiary]
  type: static
netconvert_options:
  - --geometry.remove
  - --ramps.guess
  - --junctions.join
  - [--junctions.join-dist, "20"]
  - --tls.guess-signals
  - --tls.discard-simple
  - --tls.join
  - --roundabouts.guess
  - [--keep-edges.by-vclass, "passenger,bus,emergency,truck"]
  - --remove-edges.isolated
  - [--keep-edges.components, "1"]
  - --osm.lane-access
  - --no-turnarounds.except-deadend
  - --output.street-names
  - --output.original-names
  - [--seed, "1"]
districts:
  out: data/hail/districts.geojson
  admin_levels: ["10"]
  fallback_place_values: [neighbourhood, suburb, quarter]
buildings:
  out: data/hail/buildings.geojson
  heights: sim/network/config/buildings.yaml
viewer:
  edges_out: web/public/data/edges.geojson
  districts_out: web/public/data/districts.geojson
