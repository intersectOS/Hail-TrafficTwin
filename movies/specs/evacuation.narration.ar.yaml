# Arabic narration for evacuation (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: evacuation
lines:
  - shot: before
    at: 0.6
    text: "إخلاء افتراضي عند مدخل شرم أبحر، قرب موقع برج جدة: نحو 3,750 شخصًا في 1,500 سيارة."
    say: "إِخْلَاءٌ افْتِرَاضِيٌّ عِنْدَ مَدْخَلِ شَرْمِ أَبْحُرَ، قُرْبَ مَوْقِعِ بُرْجِ جُدَّةَ: نَحْوَ ثَلَاثَةِ آلَافٍ وَسَبْعِمِئَةٍ وَخَمْسِينَ شَخْصًا فِي أَلْفٍ وَخَمْسِمِئَةِ سَيَّارَةْ."
  - shot: release
    at: 0.6
    text: "يصدر الأمر في الثامنة والربع. يغادر النطاق الأبعد أولًا، وتتوازن الحركة على المخارج."
    say: "يَصْدُرُ الأَمْرُ فِي الثَّامِنَةِ وَالرُّبْعْ. يُغَادِرُ النِّطَاقُ الأَبْعَدُ أَوَّلًا، وَتَتَوَازَنُ الحَرَكَةُ عَلَى المَخَارِجْ."
  - shot: release
    sim_t: 1500
    text: "ومن الثامنة وخمس وعشرين دقيقة، تعمل ثلاثة محاور بالاتجاه المعاكس، خروجًا على الاتجاهين كليهما."
    say: "وَمِنَ الثَّامِنَةِ وَخَمْسٍ وَعِشْرِينَ دَقِيقَةً، تَعْمَلُ ثَلَاثَةُ مَحَاوِرَ بِالاتِّجَاهِ المُعَاكِسِ، خُرُوجًا عَلَى الاتِّجَاهَيْنِ كِلَيْهِمَا."
  - shot: clearance
    at: 0.6
    text: "يخرج تسعون في المئة بعد 22.5 دقيقة. والخطة الموصى بها أبسط: توازن المخارج وحده، 23.4 دقيقة، دون حاجة إلى موافقة."
    say: "يَخْرُجُ تِسْعُونَ فِي المِئَةِ بَعْدَ اثْنَتَيْنِ وَعِشْرِينَ فَاصِلَةِ خَمْسِ دَقَائِقْ. وَالخُطَّةُ المُوصَى بِهَا أَبْسَطُ: تَوَازُنُ المَخَارِجِ وَحْدَهُ، ثَلَاثٌ وَعِشْرُونَ فَاصِلَةُ أَرْبَعِ دَقَائِقَ، دُونَ حَاجَةٍ إِلَى مُوَافَقَةْ."
  - shot: clearance
    text: "كل المعاملات افتراضية. طلب اصطناعي، غير معاير."
    say: "كُلُّ المُعَامِلَاتِ افْتِرَاضِيَّةْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
