# Arabic narration for incident (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: incident
lines:
  - shot: side-by-side
    at: 0.6
    text: "حادث افتراضي يغلق المسارين المتجهين شمالًا على المحور المؤدي إلى طريق المدينة المنورة عشرين دقيقة."
    say: "حَادِثٌ افْتِرَاضِيٌّ يُغْلِقُ المَسَارَيْنِ المُتَّجِهَيْنِ شَمَالًا عَلَى المِحْوَرِ المُؤَدِّي إِلَى طَرِيقِ المَدِينَةِ المُنَوَّرَةِ عِشْرِينَ دَقِيقَةْ."
  - shot: side-by-side
    at: 8
    text: "على اليسار الصباح المعتاد، وعلى اليمين محاكاة الحادث، بالحركة نفسها والبذرة نفسها."
    say: "عَلَى اليَسَارِ الصَّبَاحُ المُعْتَادُ، وَعَلَى اليَمِينِ مُحَاكَاةُ الحَادِثِ، بِالحَرَكَةِ نَفْسِهَا وَالبَذْرَةِ نَفْسِهَا."
  - shot: side-by-side
    at: 14
    text: "يغيّر السائقون مساراتهم حول الطريق المغلق، فينتشر التأخير في الشوارع الجانبية بدل طابور واحد طويل."
    say: "يُغَيِّرُ السَّائِقُونَ مَسَارَاتِهِمْ حَوْلَ الطَّرِيقِ المُغْلَقِ، فَيَنْتَشِرُ التَّأْخِيرُ فِي الشَّوَارِعِ الجَانِبِيَّةِ بَدَلَ طَابُورٍ وَاحِدٍ طَوِيلْ."
  - shot: difference
    at: 0.6
    text: "الطرق الحمراء أبطأ من المعتاد، والزرقاء أسرع. ويرتفع متوسط التأخير في النافذة 5.7 في المئة."
    say: "الطُّرُقُ الحَمْرَاءُ أَبْطَأُ مِنَ المُعْتَادِ، وَالزَّرْقَاءُ أَسْرَعْ. وَيَرْتَفِعُ مُتَوَسِّطُ التَّأْخِيرِ فِي النَّافِذَةِ خَمْسَةً فَاصِلَةَ سَبْعَةٍ فِي المِئَةْ."
  - shot: difference
    text: "السيناريو افتراضي. طلب اصطناعي، غير معاير."
    say: "السِّينَارْيُو افْتِرَاضِيّْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
