# Arabic narration for loop (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
# The corridor id stays Latin in the subtitle (C1); the voice says سي واحد.
film: loop
lines:
  - shot: corridor
    at: 0.6
    text: "نفق لوب الموصى به: الممر C1 من السلامة إلى جامعة الملك عبدالعزيز، 17.9 كيلومترًا و8 محطات."
    say: "نَفَقُ لُوب المُوصَى بِهِ: المَمَرُّ سِي وَاحِد مِنَ السَّلَامَةِ إِلَى جَامِعَةِ المَلِكِ عَبْدِالعَزِيزِ، سَبْعَةَ عَشَرَ فَاصِلَةَ تِسْعَةِ كِيلُومِتْرَاتٍ وَثَمَانِي مَحَطَّاتْ."
  - shot: relief
    at: 0.6
    text: "مركبات بمقعدين تنقل 28,820 راكبًا يوميًا، في حدود السعة المقيسة."
    say: "مَرْكَبَاتٌ بِمَقْعَدَيْنِ تَنْقُلُ ثَمَانِيَةً وَعِشْرِينَ أَلْفًا وَثَمَانِمِئَةٍ وَعِشْرِينَ رَاكِبًا يَوْمِيًّا، فِي حُدُودِ السَّعَةِ المَقِيسَةْ."
  - shot: relief
    text: "الطرق الزرقاء أسرع من الأساس. وينخفض تأخير ذروة الصباح 2.85 في المئة."
    say: "الطُّرُقُ الزَّرْقَاءُ أَسْرَعُ مِنَ الأَسَاسْ. وَيَنْخَفِضُ تَأْخِيرُ ذُرْوَةِ الصَّبَاحِ اثْنَيْنِ فَاصِلَةَ خَمْسَةٍ وَثَمَانِينَ فِي المِئَةْ."
  - shot: city
    at: 0.6
    text: "وفي ذروة المساء التحسّن حقيقي لكنه متذبذب، و70 في المئة من الركاب أبطأ مما لو ركبوا السيارة."
    say: "وَفِي ذُرْوَةِ المَسَاءِ التَّحَسُّنُ حَقِيقِيٌّ لَكِنَّهُ مُتَذَبْذِبٌ، وَسَبْعُونَ فِي المِئَةِ مِنَ الرُّكَّابِ أَبْطَأُ مِمَّا لَوْ رَكِبُوا السَّيَّارَةْ."
  - shot: city
    text: "فرز أولي، لا دراسة جدوى. طلب اصطناعي، غير معاير."
    say: "فَرْزٌ أَوَّلِيٌّ، لَا دِرَاسَةَ جَدْوَى. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
