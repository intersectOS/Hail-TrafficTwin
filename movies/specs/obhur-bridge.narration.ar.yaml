# Arabic narration for obhur-bridge (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: obhur-bridge
lines:
  - shot: site
    at: 0.6
    text: "يفصل شرم أبحر بين أبحر الشمالية وأبحر الجنوبية. والعبور الوحيد اليوم عند رأس الشرم."
    say: "يَفْصِلُ شَرْمُ أَبْحُرَ بَيْنَ أَبْحُرَ الشَّمَالِيَّةِ وَأَبْحُرَ الجَنُوبِيَّةْ. وَالعُبُورُ الوَحِيدُ اليَوْمَ عِنْدَ رَأْسِ الشَّرْمْ."
  - shot: site
    text: "238,130 رحلة يوميًا يعبر خط رغبتها الماء، ويختصر الجسر 145,370 منها بـ6 كيلومترات في المتوسط."
    say: "مِئَتَانِ وَثَمَانٍ وَثَلَاثُونَ أَلْفًا وَمِئَةٌ وَثَلَاثُونَ رِحْلَةً يَوْمِيًّا يَعْبُرُ خَطُّ رَغْبَتِهَا المَاءَ، وَيَخْتَصِرُ الجِسْرُ مِئَةً وَخَمْسَةً وَأَرْبَعِينَ أَلْفًا وَثَلَاثَمِئَةٍ وَسَبْعِينَ مِنْهَا بِسِتَّةِ كِيلُومِتْرَاتٍ فِي المُتَوَسِّطْ."
  - shot: before-after
    at: 0.6
    text: "يسارًا جسران عند مدخل الشرم ووسطه، ويمينًا المركبات والمسارات نفسها من دونهما."
    say: "يَسَارًا جِسْرَانِ عِنْدَ مَدْخَلِ الشَّرْمِ وَوَسَطِهِ، وَيَمِينًا المَرْكَبَاتُ وَالمَسَارَاتُ نَفْسُهَا مِنْ دُونِهِمَا."
  - shot: difference
    at: 0.6
    text: "ينقل الجسران نحو 600 و400 مركبة في الساعة، لكن في ساعة ذروة واحدة على مستوى النافذة يبقى التوفير ضمن التذبذب: فالطوابير تتكوّن عند المداخل."
    say: "يَنْقُلُ الجِسْرَانِ نَحْوَ سِتِّمِئَةٍ وَأَرْبَعِمِئَةِ مَرْكَبَةٍ فِي السَّاعَةِ، لَكِنْ فِي سَاعَةِ ذُرْوَةٍ وَاحِدَةٍ عَلَى مُسْتَوَى النَّافِذَةِ يَبْقَى التَّوْفِيرُ ضِمْنَ التَّذَبْذُبِ: فَالطَّوَابِيرُ تَتَكَوَّنُ عِنْدَ المَدَاخِلْ."
  - shot: city-result
    at: 0.6
    text: "وعلى يوم عمل كامل في الشبكة الثانية، يوفر الجسران 178,909 ساعات مركبة يوميًا، 9.2 في المئة."
    say: "وَعَلَى يَوْمِ عَمَلٍ كَامِلٍ فِي الشَّبَكَةِ الثَّانِيَةِ، يُوَفِّرُ الجِسْرَانِ مِئَةً وَثَمَانِيَةً وَسَبْعِينَ أَلْفًا وَتِسْعَمِئَةٍ وَتِسْعَ سَاعَاتِ مَرْكَبَةٍ يَوْمِيًّا، تِسْعَةً فَاصِلَةَ اثْنَيْنِ فِي المِئَةْ."
  - shot: city-result
    text: "جلّها من جسر المدخل، ويضيف جسر الوسط نحو 8,100."
    say: "جُلُّهَا مِنْ جِسْرِ المَدْخَلِ، وَيُضِيفُ جِسْرُ الوَسَطِ نَحْوَ ثَمَانِيَةِ آلَافٍ وَمِئَةْ."
  - shot: city-result
    text: "ما زالت 28 إلى 30 في المئة من المركبات تُنقل آليًا، فالحجم استرشادي. طلب اصطناعي، غير معاير."
    say: "مَا زَالَتْ ثَمَانِيَةٌ وَعِشْرُونَ إِلَى ثَلَاثِينَ فِي المِئَةِ مِنَ المَرْكَبَاتِ تُنْقَلُ آلِيًّا، فَالحَجْمُ اسْتِرْشَادِيّْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
