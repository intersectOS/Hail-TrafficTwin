# Arabic narration for events (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: events
lines:
  - shot: rain
    at: 0.6
    text: "أمطار غزيرة: يبطئ السائقون ويتباعدون. ويرتفع متوسط التأخير 23.3 في المئة."
    say: "أَمْطَارٌ غَزِيرَةٌ: يُبْطِئُ السَّائِقُونَ وَيَتَبَاعَدُونْ. وَيَرْتَفِعُ مُتَوَسِّطُ التَّأْخِيرِ ثَلَاثَةً وَعِشْرِينَ فَاصِلَةَ ثَلَاثَةٍ فِي المِئَةْ."
  - shot: flood
    at: 0.6
    text: "عاصفة تُغرق مواقع الأنفاق، وتُغلق 13 قطعة طريق. ويزيد التأخير 123.8 في المئة."
    say: "عَاصِفَةٌ تُغْرِقُ مَوَاقِعَ الأَنْفَاقِ، وَتُغْلَقُ ثَلَاثَ عَشْرَةَ قِطْعَةَ طَرِيقْ. وَيَزِيدُ التَّأْخِيرُ مِئَةً وَثَلَاثَةً وَعِشْرِينَ فَاصِلَةَ ثَمَانِيَةٍ فِي المِئَةْ."
  - shot: motorcade
    at: 0.6
    text: "موكب من ست مركبات على طريق التحلية، والتقاطعات تُفسح له."
    say: "مَوْكِبٌ مِنْ سِتِّ مَرْكَبَاتٍ عَلَى طَرِيقِ التَّحْلِيَةِ، وَالتَّقَاطُعَاتُ تُفْسَحُ لَهْ."
  - shot: motorcade
    text: "85 ثانية مقابل 66.5 بلا زحام. سيناريوهات افتراضية، طلب اصطناعي، غير معاير."
    say: "خَمْسٌ وَثَمَانُونَ ثَانِيَةً مُقَابِلَ سِتٍّ وَسِتِّينَ فَاصِلَةِ خَمْسَةٍ بِلَا زِحَامْ. سِينَارْيُوهَاتٌ افْتِرَاضِيَّةٌ، طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
