# Arabic narration for strategist (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
# Route letters stay Latin in the subtitles (the HUD shows "route A"); the voice says إيه / بي / سي.
film: strategist
lines:
  - shot: no-strategy
    at: 0.6
    text: "الثامنة والنصف. على سيارة إسعاف أن تبلغ طريق المدينة المنورة، وحادث يسدّ أحد المسارين على طريقها."
    say: "الثَّامِنَةُ وَالنِّصْفْ. عَلَى سَيَّارَةِ إِسْعَافٍ أَنْ تَبْلُغَ طَرِيقَ المَدِينَةِ المُنَوَّرَةِ، وَحَادِثٌ يَسُدُّ أَحَدَ المَسَارَيْنِ عَلَى طَرِيقِهَا."
  - shot: no-strategy
    text: "بلا استراتيجية تستغرق 173 ثانية."
    say: "بِلَا اسْتِرَاتِيجِيَّةٍ تَسْتَغْرِقُ مِئَةً وَثَلَاثًا وَسَبْعِينَ ثَانِيَةْ."
  - shot: option-1
    at: 0.6
    text: "الخيار الأول: المسار A مع ممر إنقاذ. 68 ثانية، أسرع بـ105 ثوانٍ."
    say: "الخِيَارُ الأَوَّلُ: المَسَارُ إِيه مَعَ مَمَرِّ إِنْقَاذْ. ثَمَانٍ وَسِتُّونَ ثَانِيَةً، أَسْرَعُ بِمِئَةٍ وَخَمْسِ ثَوَانْ."
  - shot: option-2
    at: 0.6
    text: "الخيار الثاني: المسار B، مع أولوية الإشارات وممر إنقاذ. 89 ثانية."
    say: "الخِيَارُ الثَّانِي: المَسَارُ بِي، مَعَ أَوْلَوِيَّةِ الإِشَارَاتِ وَمَمَرِّ إِنْقَاذْ. تِسْعٌ وَثَمَانُونَ ثَانِيَةْ."
  - shot: option-3
    at: 0.6
    text: "الخيار الثالث: المسار C وحده، 95 ثانية. والقرار يعتمده إنسان."
    say: "الخِيَارُ الثَّالِثُ: المَسَارُ سِي وَحْدَهُ، خَمْسٌ وَتِسْعُونَ ثَانِيَةْ. وَالقَرَارُ يَعْتَمِدُهُ إِنْسَانْ."
  - shot: option-3
    text: "الموقف افتراضي. طلب اصطناعي، غير معاير."
    say: "المَوْقِفُ افْتِرَاضِيّْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
