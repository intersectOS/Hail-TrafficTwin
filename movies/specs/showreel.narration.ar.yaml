# Arabic showreel narration (scripts/movies/showreel.py --lang ar): one headline per film, as in
# showreel.narration.yaml, spoken over the Arabic films' title cards. See city-24h.narration.ar.yaml.
film: showreel
lines:
  - film: city-24h
    text: "TrafficTwin جدة. يوم عمل عادي في المدينة كلها، من الثانية فجرًا حتى الثانية ليلًا."
    say: "تِرَافِيك تْوِين جُدَّةْ. يَوْمُ عَمَلٍ عَادِيٍّ فِي المَدِينَةِ كُلِّهَا، مِنَ الثَّانِيَةِ فَجْرًا حَتَّى الثَّانِيَةِ لَيْلًا."
  - film: tahlia-street
    text: "طريق التحلية على مستوى الشارع، كل مركبة تُحاكى ثانيةً بثانية."
    say: "طَرِيقُ التَّحْلِيَةِ عَلَى مُسْتَوَى الشَّارِعِ، كُلُّ مَرْكَبَةٍ تُحَاكَى ثَانِيَةً بِثَانِيَةْ."
  - film: incident
    text: "حادث افتراضي: يغيّر السائقون مساراتهم، ويرتفع متوسط التأخير 5.7 في المئة."
    say: "حَادِثٌ افْتِرَاضِيٌّ: يُغَيِّرُ السَّائِقُونَ مَسَارَاتِهِمْ، وَيَرْتَفِعُ مُتَوَسِّطُ التَّأْخِيرِ خَمْسَةً فَاصِلَةَ سَبْعَةٍ فِي المِئَةْ."
  - film: events
    text: "مطر، ونفق غارق، وموكب، كلٌّ مقارنةً بخط أساسه."
    say: "مَطَرٌ، وَنَفَقٌ غَارِقٌ، وَمَوْكِبٌ، كُلٌّ مُقَارَنَةً بِخَطِّ أَسَاسِهْ."
  - film: strategist
    text: "المخطِّط يوصل سيارة الإسعاف في 68 ثانية بدل 173."
    say: "المُخَطِّطُ يُوصِلُ سَيَّارَةَ الإِسْعَافِ فِي ثَمَانٍ وَسِتِّينَ ثَانِيَةً بَدَلَ مِئَةٍ وَثَلَاثٍ وَسَبْعِينْ."
  - film: evacuation
    text: "إخلاء افتراضي عند شرم أبحر، بخروج على مراحل وسير بالاتجاه المعاكس."
    say: "إِخْلَاءٌ افْتِرَاضِيٌّ عِنْدَ شَرْمِ أَبْحُرَ، بِخُرُوجٍ عَلَى مَرَاحِلَ وَسَيْرٍ بِالاتِّجَاهِ المُعَاكِسْ."
  - film: policy-lab
    text: "مختبر السياسات: العمل عن بعد يخفض ساعات المركبات 8.7 في المئة."
    say: "مُخْتَبَرُ السِّيَاسَاتِ: العَمَلُ عَنْ بُعْدٍ يُخَفِّضُ سَاعَاتِ المَرْكَبَاتِ ثَمَانِيَةً فَاصِلَةَ سَبْعَةٍ فِي المِئَةْ."
  - film: loop
    text: "ونفق لوب: 28,820 راكبًا يوميًا على الممر C1."
    say: "وَنَفَقُ لُوب: ثَمَانِيَةٌ وَعِشْرُونَ أَلْفًا وَثَمَانِمِئَةٍ وَعِشْرُونَ رَاكِبًا يَوْمِيًّا عَلَى المَمَرِّ سِي وَاحِدْ."
  - film: loop
    text: "طلب اصطناعي، غير معاير."
    say: "طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
  - film: obhur-bridge
    text: "جسور شرم أبحر: ضمن التذبذب في النافذة، وتوفر 9.2 في المئة من ساعات المركبات في يوم المدينة كاملًا. طلب اصطناعي، غير معاير."
    say: "جُسُورُ شَرْمِ أَبْحُرَ: ضِمْنَ التَّذَبْذُبِ فِي النَّافِذَةِ، وَتُوَفِّرُ تِسْعَةً فَاصِلَةَ اثْنَيْنِ فِي المِئَةِ مِنْ سَاعَاتِ المَرْكَبَاتِ فِي يَوْمِ المَدِينَةِ كَامِلًا. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
