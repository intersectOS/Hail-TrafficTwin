# Obhur Creek bridges (Track J): B1 (creek mouth) + B2 (mid-creek), 2+2 lanes, against the matched
# control on the obhur_creek Tier B window, weekday AM peak hour (06:00-07:00, seed 1, micro).
# Both runs route the same vehicles one-shot on the same weights; only the bridges differ (TA-018,
# A-obh-024). Runs: `python -m sim.bridge.window run --peak am --seed 1 --fcd control,obhur_bridge_b3`
# then `python -m sim.bridge.window publish`. KPI values are the docs/obhur-bridge.md tables, never
# recomputed here. Window-scale shots, then a city-scale result card (pass 7): the B1 / B3 / B2-increment
# VHT figures of the 24 h Tier A runs on network v2 (docs/obhur-bridge.md section 5) as literal KPIs.
# The window network was cut from the first city network, so the v2 city runs are not drawn as a
# map layer (their edges would only map by id onto a different network); the card's map stays the
# window difference map, and the caption says so.
# Film network = the first source referenced (b3, the bridge network), so the new links are drawn;
# the control has no data on them (no-data colour). Vehicles are recorded only within 900 m of the
# landings (A-obh FCD filter), so the trips layer shows the crossings, not the whole window.
# There is no wipe in the film schema: the before/after is the side-by-side split.
#
# Narration: movies/specs/obhur-bridge.narration.yaml.
film: obhur-bridge
#   lines:
#     - {shot: site, at: 0.6, text: "Sharm Obhur splits North and South Obhur. Today the only crossing is at the head of the creek."}
#     - {shot: site, text: "About 238,000 car trips a day have a desire line across the water; a bridge shortens 145,000 of them by 6 kilometres on average."}
#     - {shot: before-after, at: 0.6, text: "Left, bridges at the mouth and mid-creek; right, the same vehicles and routing without them."}
#     - {shot: difference, at: 0.6, text: "The bridges carry about 600 and 400 vehicles an hour, but at window scale the time saved stays inside the noise: queues build at the landings."}
#     - {shot: difference, text: "Window scale, one peak hour, synthetic demand, uncalibrated."}
film: obhur-bridge
title: Bridges across Sharm Obhur
subtitle: Tier B window, bridges B1 + B2 (2+2 lanes) against the matched control, weekday AM peak hour
duration_s: 45
showreel: [30, 44]          # end of the window difference map + the city-scale result card
clock_t0: "00:00"            # sim_t is the absolute time of day (A-mov-007)
tier: B
title_card_s: 2.5
sources:
  b3: {run: obhur-am-s1-obhur_bridge_b3}
  ctrl: {run: obhur-am-s1-control}
basemap:
  bbox: [39.03, 21.65, 39.22, 21.84]
shots:
  - id: site
    duration_s: 12
    layers:
      heat: b3
      trips: b3
      buildings: false
      line: &b1 [[39.10018, 21.70910], [39.09641, 21.70950], [39.09371, 21.70978], [39.08792, 21.71039]]
      stations: [[39.09641, 21.70950], [39.09371, 21.70978]]
      outline: [[39.11972, 21.73505], [39.11494, 21.74174], [39.11446, 21.74140], [39.11924, 21.73471]]
      outline_label: "B2 mid-creek"
    camera:
      - {t: 0,  lon: 39.1180, lat: 21.7420, zoom: 12.6, pitch: 30, bearing: 30, sim_t: 21600}
      - {t: 12, lon: 39.0990, lat: 21.7140, zoom: 14.6, pitch: 52, bearing: 10, sim_t: 22500, ease: in_out}
    hud:
      caption: "B1 at the creek mouth (281 m over water) and B2 mid-creek (890 m)"
      detail: Today cross-creek trips drive round the creek head; free-flow screening of the weekday city baseline
      legend: speed
      kpis:
        - {label: Car trips/day across the creek, value: 238130, decimals: 0}
        - {label: Trips a bridge shortens, value: 145370, decimals: 0}
        - {label: Detour removed per trip, value: 6.0, unit: km, decimals: 1}
  - id: before-after
    duration_s: 13
    layers:
      mode: split
      split: [b3, ctrl]
      buildings: false   # no line overlay here: overlays draw on both halves, the control has no bridge
    camera:
      - {t: 0,  lon: 39.0990, lat: 21.7140, zoom: 14.6, pitch: 52, bearing: 10, sim_t: 22500}
      - {t: 13, lon: 39.1060, lat: 21.7240, zoom: 14.0, pitch: 48, bearing: 25, sim_t: 23700, ease: in_out}
    hud:
      caption: Same vehicles, same routing, with and without the bridges
      detail: Left, B1 + B2 open; right, the matched control. Edge speed against the limit, 5-minute bins
      legend: speed
      split_labels: ["B1 + B2, 2+2 lanes", "No bridge (matched control)"]
      kpis:
        - {label: "B1, both directions", value: 558, unit: veh/h, decimals: 0}
        - {label: "B2, both directions", value: 427, unit: veh/h, decimals: 0}
  - id: difference
    duration_s: 11
    layers:
      mode: diff
      heat: b3
      compare: ctrl
      buildings: false
      line: *b1
      outline: [[39.11972, 21.73505], [39.11494, 21.74174], [39.11446, 21.74140], [39.11924, 21.73471]]
      outline_label: "B2"
    camera:
      - {t: 0,  lon: 39.1060, lat: 21.7240, zoom: 14.0, pitch: 48, bearing: 25, sim_t: 23700}
      - {t: 11, lon: 39.1200, lat: 21.7420, zoom: 12.8, pitch: 35, bearing: 35, sim_t: 25200, ease: in_out}
    hud:
      caption: Where traffic moves
      detail: Bridge run minus matched control; blue = faster, red = slower. Prince Abdullah Al-Faisal St and the Corniche ease, King Abdulaziz Rd loads up; the window total stays inside the noise
      legend: diff
      kpis:
        - {label: "Time per vehicle, seed 1", value: 10.1, unit: s, decimals: 1, sign: true}
        - {label: "Time per vehicle, seed 2", value: -8.1, unit: s, decimals: 1, sign: true}
        - {label: "Noise band, +/-", value: 20, unit: s, decimals: 0}
  - id: city-result
    duration_s: 9            # the narration stretches it to fit its three lines
    layers:
      mode: diff
      heat: b3
      compare: ctrl
      buildings: false
      line: *b1
      outline: [[39.11972, 21.73505], [39.11494, 21.74174], [39.11446, 21.74140], [39.11924, 21.73471]]
      outline_label: "B2"
    camera:
      - {t: 0,  lon: 39.1200, lat: 21.7420, zoom: 12.8, pitch: 35, bearing: 35, sim_t: 25200}
      - {t: 9, lon: 39.1250, lat: 21.7350, zoom: 12.2, pitch: 30, bearing: 15, ease: in_out}
    hud:
      caption: "City scale: a whole weekday on network v2, against the matched control"
      detail: "Tier A 24 h runs, 10 % sample; 28-30 % of vehicles teleport and the B1 span is jammed in both peaks, so sizes are indicative. Map = the window run"
      legend: diff
      kpis:
        - {label: "B1 mouth bridge, vehicle-hours/day", value: -170801, decimals: 0, sign: true}
        - {label: "B1 + B2, vehicle-hours/day", value: -178909, decimals: 0, sign: true}
        - {label: "B2 on top of B1, vehicle-hours/day", value: -8100, decimals: 0, sign: true}
