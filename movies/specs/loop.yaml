# The Jeddah Loop (Track D): the recommended corridor and policy from docs/loop.md.
# C1 Al-Salamah - King Abdulaziz University (17.9 tunnel-km, 8 stations), shuttle mode with
# ridership capped by the measured capacity (alpha 0.3), run `loop_recommended`
# (`uv run python -m sim.loop.run loop_recommended`, same transform as Track D's loop_opt_c1_a0p3)
# against the weekday baseline (10 % sample, seed 1, meso). Blue = faster with the Loop, red = slower.
# KPI values are the docs/loop.md Recommendation table (two-seed mean where stated), never
# recomputed here. Station coordinates from sim/policies/loop_recommended.yaml.
film: loop
title: The Jeddah Loop
subtitle: Tier A city, recommended tunnel corridor C1 against the weekday baseline
duration_s: 34
showreel: [4, 24]           # excerpt in the showreel (2-3 min total)
tier: A
title_card_s: 2.5
sources:
  base: {run: baseline-weekday-f0.1-s1-e5f1906a-65fac195-65b0f3}
  loop: {run: loop_recommended}
basemap:
  bbox: [39.02, 21.24, 39.36, 21.92]
shots:
  - id: corridor
    duration_s: 10
    layers:
      heat: base
      buildings: false
      line: &c1 [[39.15068, 21.59789], [39.1584, 21.58455], [39.17875, 21.5689], [39.19279, 21.5544],
                 [39.20311, 21.53635], [39.22403, 21.52746], [39.23488, 21.5109], [39.2489, 21.4964]]
      stations: *c1
    camera:
      - {t: 0,  lon: 39.1900, lat: 21.5300, zoom: 11.6, pitch: 30, bearing: 20, sim_t: 23400}
      - {t: 10, lon: 39.2000, lat: 21.5470, zoom: 12.9, pitch: 50, bearing: 48, sim_t: 27000, ease: in_out}
    hud:
      caption: "C1: Al-Salamah to King Abdulaziz University, 17.9 km, 8 stations"
      detail: Best of 8 candidate corridors (7 on the delay hot spots, 1 airport test); weekday baseline, morning peak (speed against the limit)
      legend: speed
      kpis:
        - {label: Tunnel length, value: 17.9, unit: km, decimals: 1}
        - {label: Stations, value: 8, decimals: 0}
        - {label: "Capex, central (USD M)", value: 446, decimals: 0}
  - id: relief
    duration_s: 14
    layers:
      mode: diff
      heat: loop
      compare: base
      buildings: false
      line: *c1
      stations: *c1
    camera:
      - {t: 0,  lon: 39.2000, lat: 21.5470, zoom: 12.9, pitch: 50, bearing: 48, sim_t: 27000}
      - {t: 14, lon: 39.2000, lat: 21.5470, zoom: 12.7, pitch: 54, bearing: 80, sim_t: 34200, ease: in_out}
    hud:
      caption: Shuttle Loop, ridership capped by the measured capacity (shift share 0.3)
      detail: Loop run minus the baseline, morning peak; car trips between stations shift to 2-seat shuttles in the tunnel
      legend: diff
      kpis:
        - {label: Passengers per day, value: 28820, decimals: 0}
        - {label: "Congestion relief, two-seed mean (VHT/day)", value: 63349, decimals: 0}
        - {label: Morning-peak road delay, value: -2.85, unit: "%", decimals: 2, sign: true}
  - id: city
    duration_s: 10
    layers:
      mode: diff
      heat: loop
      compare: base
      buildings: false
      line: *c1
      stations: *c1
    camera:
      - {t: 0,  lon: 39.2000, lat: 21.5470, zoom: 12.7, pitch: 54, bearing: 80, sim_t: 57600}
      - {t: 10, lon: 39.1900, lat: 21.5500, zoom: 11.2, pitch: 34, bearing: 20, sim_t: 68400, ease: in_out}
    hud:
      caption: Evening peak across the city
      detail: Relief two-seed mean, band 23,435 to 103,263 VHT/day with the replicate noise; 70 % of riders slower than by car
      legend: diff
      kpis:
        - {label: Relief per USD M (VHT/day), value: 141.9, decimals: 1}
        - {label: Net person-hours per day, value: 54150, decimals: 0}
        - {label: Riders slower than by car, value: 70, unit: "%", decimals: 0}
