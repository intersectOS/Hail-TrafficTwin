# Arabic narration for tahlia-street (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: tahlia-street
lines:
  - shot: dolly
    at: 2.6
    text: "طريق التحلية عن قرب، في ذروة الصباح. هنا تُحاكى كل مركبة، ثانيةً بثانية."
    say: "طَرِيقُ التَّحْلِيَةِ عَنْ قُرْبٍ، فِي ذُرْوَةِ الصَّبَاحْ. هُنَا تُحَاكَى كُلُّ مَرْكَبَةٍ، ثَانِيَةً بِثَانِيَةْ."
  - shot: dolly
    at: 9
    text: "الطرق ملوّنة بالسرعة مقارنةً بالحد، وكل سيارة بسرعتها، يتبعها أثر قصير."
    say: "الطُّرُقُ مُلَوَّنَةٌ بِالسُّرْعَةِ مُقَارَنَةً بِالحَدِّ، وَكُلُّ سَيَّارَةٍ بِسُرْعَتِهَا، يَتْبَعُهَا أَثَرٌ قَصِيرْ."
  - shot: dolly
    at: 17
    text: "وشمالًا يتكوّن الطابور نحو طريق المدينة المنورة."
    say: "وَشَمَالًا يَتَكَوَّنُ الطَّابُورُ نَحْوَ طَرِيقِ المَدِينَةِ المُنَوَّرَةْ."
  - shot: dolly
    text: "تأخذ هذه النافذة حركتها من نموذج المدينة. طلب اصطناعي، غير معاير."
    say: "تَأْخُذُ هَذِهِ النَّافِذَةُ حَرَكَتَهَا مِنْ نَمُوذَجِ المَدِينَةْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
