# Arabic narration for city-24h (scripts/movies/narrate.py --lang ar). Same lines and anchors as
# city-24h.narration.yaml: `text` = subtitle (same figures as the English line), `say` = the fully
# vowelised Modern Standard Arabic the voice speaks, numbers in words (docs/movies-arabic.md).
film: city-24h
lines:
  - shot: timelapse
    at: 3.2
    text: "هذه جدة في يوم عمل عادي، من الثانية فجرًا حتى الثانية من الليلة التالية."
    say: "هَذِهِ جُدَّةُ فِي يَوْمِ عَمَلٍ عَادِيٍّ، مِنَ الثَّانِيَةِ فَجْرًا حَتَّى الثَّانِيَةِ مِنَ اللَّيْلَةِ التَّالِيَةْ."
  - shot: timelapse
    sim_t: 21600
    text: "كل طريق ملوّن بسرعته مقارنةً بالسرعة المحددة: الأحمر مزدحم، والفيروزي انسياب حر."
    say: "كُلُّ طَرِيقٍ مُلَوَّنٌ بِسُرْعَتِهِ مُقَارَنَةً بِالسُّرْعَةِ المُحَدَّدَةِ: الأَحْمَرُ مُزْدَحِمٌ، وَالفَيْرُوزِيُّ انْسِيَابٌ حُرّْ."
  - shot: timelapse
    sim_t: 27000
    text: "تشتد ذروة الصباح بعد السابعة، مع خروج رحلات العمل والمدارس من المنازل."
    say: "تَشْتَدُّ ذُرْوَةُ الصَّبَاحِ بَعْدَ السَّابِعَةِ، مَعَ خُرُوجِ رِحْلَاتِ العَمَلِ وَالمَدَارِسِ مِنَ المَنَازِلْ."
  - shot: timelapse
    sim_t: 57600
    text: "وفي المساء تمتلئ الشبكة من جديد، وتبتعد الكاميرا لتُظهر المدينة كلها."
    say: "وَفِي المَسَاءِ تَمْتَلِئُ الشَّبَكَةُ مِنْ جَدِيدٍ، وَتَبْتَعِدُ الكَامِيرَا لِتُظْهِرَ المَدِينَةَ كُلَّهَا."
  - shot: timelapse
    text: "تنبيه: ما زالت 28.3 في المئة من المركبات تُنقل آليًا عبر الاختناقات في هذه الشبكة، وكانت 50.5 في المئة في الشبكة الأولى. طلب اصطناعي، غير معاير."
    say: "تَنْبِيهٌ: مَا زَالَتْ ثَمَانِيَةٌ وَعِشْرُونَ فَاصِلَةُ ثَلَاثَةٍ فِي المِئَةِ مِنَ المَرْكَبَاتِ تُنْقَلُ آلِيًّا عَبْرَ الاخْتِنَاقَاتِ فِي هَذِهِ الشَّبَكَةِ، وَكَانَتْ خَمْسِينَ فَاصِلَةَ خَمْسَةٍ فِي المِئَةِ فِي الشَّبَكَةِ الأُولَى. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
