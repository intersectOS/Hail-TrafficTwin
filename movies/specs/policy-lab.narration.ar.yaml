# Arabic narration for policy-lab (scripts/movies/narrate.py --lang ar); see city-24h.narration.ar.yaml.
film: policy-lab
lines:
  - shot: remote-work
    at: 0.6
    text: "مختبر السياسات، على شبكة المدينة الثانية: الطرق الزرقاء تصبح أسرع، والحمراء أبطأ."
    say: "مُخْتَبَرُ السِّيَاسَاتِ، عَلَى شَبَكَةِ المَدِينَةِ الثَّانِيَةِ: الطُّرُقُ الزَّرْقَاءُ تُصْبِحُ أَسْرَعَ، وَالحَمْرَاءُ أَبْطَأْ."
  - shot: remote-work
    text: "مع 30 في المئة عمل عن بعد، تنخفض ساعات المركبات 8.7 في المئة، و7.7 في الشبكة الأولى."
    say: "مَعَ ثَلَاثِينَ فِي المِئَةِ عَمَلٍ عَنْ بُعْدٍ، تَنْخَفِضُ سَاعَاتُ المَرْكَبَاتِ ثَمَانِيَةً فَاصِلَةَ سَبْعَةٍ فِي المِئَةِ، وَسَبْعَةً فَاصِلَةَ سَبْعَةٍ فِي الشَّبَكَةِ الأُولَى."
  - shot: staggered-schools
    at: 0.6
    text: "تدريج بدء المدارس على 60 دقيقة يخفض تأخير الصباح 1.8 في المئة فقط، و9.1 في الشبكة الأولى."
    say: "تَدْرِيجُ بَدْءِ المَدَارِسِ عَلَى سِتِّينَ دَقِيقَةً يُخَفِّضُ تَأْخِيرَ الصَّبَاحِ وَاحِدًا فَاصِلَةَ ثَمَانِيَةٍ فِي المِئَةِ فَقَطْ، وَتِسْعَةً فَاصِلَةَ وَاحِدٍ فِي الشَّبَكَةِ الأُولَى."
  - shot: cordon
    at: 0.6
    text: "رسم دخول للمركز بـ10 ريالات يدفع الحركة إلى الأطراف: ترتفع ساعات المركبات 17.2 في المئة، و12.4 في الشبكة الأولى."
    say: "رَسْمُ دُخُولٍ لِلْمَرْكَزِ بِعَشَرَةِ رِيَالَاتٍ يَدْفَعُ الحَرَكَةَ إِلَى الأَطْرَافِ: تَرْتَفِعُ سَاعَاتُ المَرْكَبَاتِ سَبْعَةَ عَشَرَ فَاصِلَةَ اثْنَيْنِ فِي المِئَةِ، وَاثْنَيْ عَشَرَ فَاصِلَةَ أَرْبَعَةٍ فِي الشَّبَكَةِ الأُولَى."
  - shot: cordon
    text: "الاختناق والنقل الآلي باقيان، فالنتائج استرشادية. طلب اصطناعي، غير معاير."
    say: "الاخْتِنَاقُ وَالنَّقْلُ الآلِيُّ بَاقِيَانِ، فَالنَّتَائِجُ اسْتِرْشَادِيَّةْ. طَلَبٌ اصْطِنَاعِيٌّ، غَيْرُ مُعَايَرْ."
