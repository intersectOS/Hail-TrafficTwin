# Tier B microscopic window at street level: a dolly east along Tahlia Street
# (Prince Mohammed bin Abdulaziz St) through the morning peak of the window baseline.
film: tahlia-street
title: Tahlia Street, morning peak
subtitle: Tier B microscopic window, every vehicle simulated at 1 s
duration_s: 30
showreel: [2.5, 22.5]           # excerpt in the showreel (2-3 min total)
clock_t0: "08:00"            # A-mov-007
tier: B
sources:
  base: {run: "accident_tahlia-tahlia-s1-257eae8d~baseline"}
shots:
  - id: dolly
    duration_s: 30
    layers:
      heat: base
      trips: base
      color_by: speed
