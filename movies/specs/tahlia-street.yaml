      - {t: 22, lon: 39.1712, lat: 21.5560, zoom: 17.1, pitch: 60, bearing: 15, ease: in_out}
      - {t: 30, lon: 39.1713, lat: 21.5596, zoom: 17.5, pitch: 64, bearing: 340, sim_t: 2880, ease: in_out}
