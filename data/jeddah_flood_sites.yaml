# Jeddah flood sites: reviewed list of flood-prone underpasses, wadi crossings and road segments.
# Purpose: input to the flood event (sim/events/flood.py): edges within radius_m of each site are
#   closed during a flood scenario. Simulation results using it remain "synthetic demand, uncalibrated".
# Public literature and press only (peer-reviewed papers, SPA, Saudi/Arab press). No commercial
#   traffic data, no scraping. Compiled 2026-10-16 by data-scout (Track B, M5).
# Locations checked against OpenStreetMap (data/osm/jeddah.osm.pbf, ODbL) with osmium + shapely:
#   osm_ways are the OSM way ids of the tunnel/bridge/channel structures matched to each site.
#
# events: years of the floods in which the site is reported flooded or closed.
#   2009 = 25 Nov 2009, 2011 = 26 Jan 2011 (the two reference events). Later events are also
#   recorded where a dated source names the site: 2015 = 17-19 Nov 2015, 2017 = 21-22 Nov 2017.
#   The smaller rain of ~15-17 Jan 2011 (Municipality statement, SPA 17 Jan 2011) is NOT counted
#   as "2011"; it is mentioned in review text only.
#
# confidence: high = site named in a source + structure located in OSM;
#   medium = named, location approximate or identification partly inferred;
#   low = area only (district / flood path), point chosen by the compiler.
#
# radius_m (ASSUMPTION, register in docs/assumptions.md):
#   assumption: default 80 m for a single underpass (covers the depressed section and the
#   intersection directly above, which sources say ponded too); 120-150 m for long tunnels or
#   paired underpasses; 300-500 m for wadi crossings (flow spreads across the carriageway and
#   ramps; 2009/2011 reports describe highway sections cut, not single points); 600-800 m for
#   area-only (district) sites. Not calibrated against flood extents.
#
# Not included (named in sources but could not be located): Al-Salam tunnel on King Abdulaziz Rd
#   (Al-Madina 2017), Kilo 14, Al-Sawaed, Al-Harazat, Umm Al-Khair dam/scheme, "Jack" Street in
#   Quwaizah, Hail Street section (Al-Watan 29 Jan 2011, too long to place).
