# Hail flood sites: wadi crossings and underpasses where a flood event closes the road.
# Purpose: input to the flood event (sim/events/flood.py): edges whose OSM way id is in osm_ways
#   (origId method), else edges within radius_m of the site, are closed during a flood scenario.
#   Results using it remain "synthetic demand, uncalibrated".
# Hail city lies on Wadi Al-Adiri (وادي الأديرع), which splits it into eastern and western halves
#   (Saudipedia). Press reports of recent Hail rains (Okaz, Nov 2025, Dec 2025, Apr 2026) name
#   villages south of the city (Al-Ish, Al-Hamriyah, Sarra) but no specific city streets, so the
#   sites below are located from OpenStreetMap: the named wadis and shuaibs where they cross the
#   main roads, and the three road underpasses mapped in OSM. They are candidates for review by the
#   Municipality, not a record of past closures.
#
# confidence: medium = named watercourse with a public source + crossing located in OSM;
#   low = located from OSM structure or a named shuaib only.
# radius_m (ASSUMPTION): 300 m for wadi crossings (flow spreads over the carriageway and the
#   approaches), 80-120 m for underpasses. Only used where osm_ways match no edge.
# events: years of documented floods at the site; empty where none was found.
